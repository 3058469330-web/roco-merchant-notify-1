name: 远行商人提醒

on:
  # 手动触发 + 定时触发（每 30 分钟一次，Asia/Shanghai；脚本内部按"8/12/16/20 时段"去重）
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "Asia/Shanghai"

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 计算今天日期（Asia/Shanghai）
        id: date
        run: echo "cache_date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 恢复今日时段去重缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.rocom_slot_cache.txt
          key: rocom-slot-cache-${{ steps.date.outputs.cache_date }}
          restore-keys: rocom-slot-cache-

      - name: 拉取并推送远行商人信息
        env:
          ROCOM_TOKEN: ${{ secrets.ROCOM_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SLOT_CACHE_FILE: ${{ github.workspace }}/.rocom_slot_cache.txt
        run: python main.py

      - name: 保存今日时段去重缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.rocom_slot_cache.txt
          key: rocom-slot-cache-${{ steps.date.outputs.cache_date }}
