name: 远行商人提醒

on:
  # 手动触发 + 定时触发（每天 8/12/16/20 点，Asia/Shanghai）
  workflow_dispatch:
  schedule:
    - cron: "0 8,12,16,20 * * *"
      timezone: "Asia/Shanghai"

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 拉取并推送远行商人信息
        env:
          ROCOM_TOKEN: ${{ secrets.ROCOM_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
